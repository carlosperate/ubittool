name: Test

on: [push, pull_request]

jobs:
  run-tests:
    strategy:
      matrix:
        # macOS 15 Intel runner is x86_64 and macOS 14 runner is arm64
        os: [ubuntu-22.04, macos-15-intel, macos-14, windows-2019]
        python-version: ["3.7","3.8", "3.9", "3.10", "3.11"]
        exclude:
          # 3.7 not available for arm macOS
          - os: macos-14
            python-version: "3.7"
          # Issues with tkinter & the Python built by setup-python in macOS
          # https://github.com/actions/setup-python/issues/649#issuecomment-2601049254
          - os: macos-15-intel
            python-version: "3.7"
        include:
          # This older version does work
          # https://github.com/actions/setup-python/issues/649#issuecomment-1903762448
          - os: macos-15-intel
            python-version: "3.7.15"
      fail-fast: false
    name: Py ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install ubittool dependencies
        run: poetry install --verbose
      - name: Prepare Ubuntu xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 xvfb
      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: xvfb-run poetry run python make.py check
      - name: Run tests
        if: runner.os != 'Linux'
        run: poetry run python make.py check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
