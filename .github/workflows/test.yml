name: Test

on: [push, pull_request]

jobs:
  run-tests:
    strategy:
      matrix:
        # macOS 15 Intel runner is x86_64 and macOS 14 runner is arm64
        os: [ubuntu-22.04, macos-15-intel, macos-14, windows-2019]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    name: Py ${{ matrix.python-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: python -m pip install --upgrade pip
      - run: python -c "import sysconfig; print(sysconfig.get_platform())"
      - run: uv run python -c "import sysconfig; print(sysconfig.get_platform())"
      - name: Install ubittool dependencies
        run: uv sync --python ${{ matrix.python-version }} --verbose
      - name: Prepare Ubuntu xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 xvfb
      - name: Run tests (Ubuntu)
        if: runner.os == 'Linux'
        run: xvfb-run uv run python make.py check
      - name: Run tests
        if: runner.os != 'Linux'
        run: uv run python make.py check
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
